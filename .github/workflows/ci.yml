name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate pull request
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr.mjs
      - run: pnpm check
      - name: Verify published package includes dist
        run: |
          pnpm pack --dry-run | grep -qx 'dist/index.js' || {
            echo "::error::dist/index.js missing from the packed tarball; the publish step would ship a broken package."
            exit 1
          }
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
