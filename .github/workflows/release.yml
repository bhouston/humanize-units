name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and preview the release without publishing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release can only be dispatched on main (got ${{ github.ref }})."
          exit 1
  checks:
    needs: guard
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the published release baseline
        run: git rev-parse --verify "refs/tags/v$(node -p "require('./package.json').version")"
      - run: pnpm build
      - name: Publish through npm OIDC
        run: pnpm release ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
